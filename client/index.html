    <script>
      // Entry-graph chunk self-heal — INLINE because when a chunk in the entry's
      // STATIC import graph is cache-poisoned (text/html or a stale 404 stored
      // immutably under a .js URL — the 2026-07-16 incident), the module graph
      // never executes: no React, no patcher, blank page. This is the only code
      // that still runs. On the entry <script type=module> firing "error"
      // (any failed module in its static graph fires it), refetch EVERY
      // module/preload URL with cache:"reload" — the one fetch mode that
      // overwrites the HTTP-cache entry — then reload, budgeted via the same
      // sessionStorage key as src/patcher/chunkHeal.ts (lazy-chunk healer):
      // 2 reloads per 60s across BOTH healers, so nothing can loop the tab.
      (() => {
        const KEY = "mmo:chunk-heal-reloads"; // keep in sync with chunkHeal.ts
        let fired = false;
        addEventListener(
          "error",
          (e) => {
            const t = e.target;
            if (fired || !t || t.tagName !== "SCRIPT" || t.type !== "module") return;
            fired = true;
            const urls = [];
            document
              .querySelectorAll('script[type="module"][src], link[rel="modulepreload"][href]')
              .forEach((el) => {
                urls.push(el.src || el.href);
              });
            console.warn("[chunk-heal:inline] entry module failed — repairing", urls.length, "cache entries");
            Promise.allSettled(urls.map((u) => fetch(u, { cache: "reload" }))).then(() => {
              let count = 0;
              let start = Date.now();
              try {
                const raw = sessionStorage.getItem(KEY);
                if (raw) {
                  const p = JSON.parse(raw);
                  if (Date.now() - p[1] < 60000) {
                    count = p[0];
                    start = p[1];
                  }
                }
              } catch {}
              if (count >= 2) {
                fired = false; // budget spent — stay up; a later manual reload may retry
                return;
              }
              try {
                sessionStorage.setItem(KEY, JSON.stringify([count + 1, start]));
              } catch {}
              location.reload();
            });
          },
          true, // capture: element "error" events don't bubble
        );
      })();
    </script>    <script>
      // Bosta on-isitma (S2 madde 17) — SW onbellegini OYUN ACIKKEN, tarayici
      // bostayken doldurur ki sonraki girisin "Icerik yukleniyor" suresi
      // kisalsin. Bilincli iyilestirme sapmasi: canli Silkroad Online kabugunda boyle
      // bir betik YOK; bundle'a dokunulmaz, klasik script (module DEGIL) —
      // chunk-heal gibi pakettten bagimsiz calisir. Mekanizma: /version.json
      // (no-store) -> manifestUrl -> manifest'ten KUCUK bir sicak kume secilir
      // ve '/assets/'+key (decodeURIComponent uyumlu — tarayici kodlar, SW
      // cozer) fetch(u,{priority:'low'}) ile SIRAYLA gezilir. SW (sw.js
      // cacheFirst) her cevabi sha256 dogrulayip game-assets'e yazar;
      // onbellekte olan girdiler aga hic cikmaz. Kota/ag hatalari SESSIZ.
      (() => {
        // Eski tarayicida hic baslama; ilk ziyarette SW sayfayi henuz kontrol
        // etmiyorsa VAZGEC — o oturumda patcher zaten zorunlu cekirdegi
        // (ktx2 preseed) indiriyor, isitmayi sonraki oturuma birakiriz.
        if (!("requestIdleCallback" in window)) return;
        // Sicak kume secimi. ESKI HALI (S1 madde 5 ile duzeltildi): SADECE
        // kucukten buyuge siralayip 150MB'de kesiyordu. Olculdu: secim 7069
        // dosya / 150.0 MB oluyor ama secimdeki EN BUYUK dosya 80.7 KB —
        // yani "Icerik yukleniyor" cubugunun BEKLEDIGI jangan statiklerinin
        // (410 GLB / 83.6 MB) BAYT OLARAK yalnizca %7.0'si (120 dosya /
        // 5.8 MB) isitiliyordu. Cubugun bekledigi 77.8 MB hic isitilmiyordu.
        //
        // YENI: once GIRIS BOLGESININ statik modelleri, spawn'a olan
        // UZAKLIGA gore siralanmis olarak isitilir; kalan butce eski
        // davranisla (kucukten buyuge) doldurulur — yani eski kapsama
        // KAYBOLMAZ, sadece onune dogru kume gecer.
        const BUTCE = 150 * 1024 * 1024;
        // server/config.json -> world.startZone ile ayni tutulmali. Yanlis
        // olursa isitma coker degil, sadece eski davranisa doner (asagida
        // try/catch). SPAWN yalnizca SIRALAMAYI etkiler, KUME UYELIGINI
        // degil: sapsa bile dogru bolgenin modelleri yine isitilir.
        const ONCELIKLI_BOLGE = "jangan_province";
        const SPAWN = { x: 10548, z: 550 }; // olculen dogus noktasi
        let kuyruk = null; // null = manifest henuz okunmadi
        const hazirla = async () => {
          const v = await fetch("/version.json", { cache: "no-store" }).then((r) => r.json());
          const man = await fetch(v.manifestUrl).then((r) => r.json());
          const dosyalar = man && man.files ? man.files : {};
          const secim = [];
          const secili = new Set();
          let toplam = 0;
          const ekle = (k) => {
            const e = dosyalar[k];
            if (!e || typeof e.s !== "number") return false; // butcelenemeyen girdiyi atla
            if (secili.has(k)) return true;
            if (toplam + e.s > BUTCE) return false;
            toplam += e.s;
            secili.add(k);
            secim.push(k);
            return true;
          };

          // 1) ONCE: giris bolgesinin statik modelleri, spawn'a yakindan uzaga.
          //    Cubugun gercekte bekledigi kume budur (olculdu: 410 model /
          //    83.6 MB, hepsi manifestte). Bolge dosyasi yoksa sessizce atla.
          try {
            const st = await fetch("/assets/zones/" + ONCELIKLI_BOLGE + "/statics.json").then((r) =>
              r.ok ? r.json() : null,
            );
            if (Array.isArray(st)) {
              // modelKey -> spawn'a EN YAKIN yerlesim mesafesi (Chebyshev:
              // motorun hucre izgarasiyla ayni geometri)
              const enYakin = new Map();
              for (const p of st) {
                if (!p || typeof p.modelKey !== "string") continue;
                const d = Math.max(Math.abs(p.x - SPAWN.x), Math.abs(p.z - SPAWN.z));
                const o = enYakin.get(p.modelKey);
                if (o === undefined || d < o) enYakin.set(p.modelKey, d);
              }
              const sirali = [...enYakin.entries()].sort((a, b) => a[1] - b[1]);
              for (const [mk] of sirali) ekle("models/static/" + mk + ".glb");
              // bolge verisinin kendisi de isinsin (SW'ye yazilir)
              ekle("zones/" + ONCELIKLI_BOLGE + "/statics.json.gz");
            }
          } catch (e) {
            // bolge dosyasi yok/bozuk — eski davranisla devam
          }

          // 2) SONRA: eski davranis (kucukten buyuge), zaten secilenleri atlar.
          const girdiler = Object.entries(dosyalar).sort((a, b) => (a[1].s || 0) - (b[1].s || 0));
          for (const [k, e] of girdiler) {
            if (!e || typeof e.s !== "number") continue;
            if (secili.has(k)) continue;
            if (toplam + e.s > BUTCE) break; // butce doldu — kalanini birak
            ekle(k);
          }
          return secim;
        };
        const adim = () => {
          requestIdleCallback(
            async () => {
              try {
                if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
                if (kuyruk === null) kuyruk = await hazirla();
                if (!kuyruk.length) return;
                // Bosta dilim basina 4 dosya (eskiden 1). Gerekce (S1 madde 5):
                // secim binlerce girdi olabiliyor ve dilim basina TEK dosya ile
                // kume makul surede bitmiyordu. 4 hala nazik — istekler
                // priority:'low' ve yalnizca requestIdleCallback icinde.
                const parti = kuyruk.splice(0, 4);
                await Promise.all(
                  parti.map(async (k) => {
                    try {
                      const r = await fetch("/assets/" + k, { priority: "low" });
                      if (r && r.ok) await r.arrayBuffer(); // govdeyi tuket, SW klonu serbest kalsin
                    } catch (e) {
                      // tek dosyanin hatasi tum partiyi dusurmesin
                    }
                  }),
                );
                if (kuyruk.length) adim();
              } catch (e) {
                // kota/ag/ayrisma — sessizce birak (madde 17 nasilDogrulanir)
              }
            },
            { timeout: 60000 },
          );
        };
        adim();
      })();
    </script>
